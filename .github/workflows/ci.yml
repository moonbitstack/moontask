name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

  # The redis module against a real server. The broker's guarantees are about
  # what a server does with a list and a sorted set across several consumers, so
  # this is the only place they are actually checked: a fake would answer the
  # shapes and none of the questions.
  redis:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MOONTASK_REDIS_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the server answers
        run: |
          # The client lives in the container, not on the runner, so the probe is
          # a plain socket that speaks the first two bytes of the protocol.
          for attempt in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379; printf 'PING\r\n' >&3; head -c 5 <&3 | grep -q PONG); then exit 0; fi
            sleep 1
          done
          echo "::error::no redis on 127.0.0.1:6379"
          exit 1

      - name: moon test (redis module, live server)
        working-directory: moontask-redis
        run: |
          moon check --target native --deny-warn
          moon test --target native

      - name: lint (fmt is clean)
        working-directory: moontask-redis
        run: |
          moon fmt && git diff --exit-code

  # Celery 5 on the other side of one redis: a chain, a chord, a reservation and
  # an eta in each direction, plus the two-way queue. The scripts bring their own
  # redis container, so this job adds the interpreter and nothing else.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the bridge the scripts drive
        run: moon build --target native

      - name: a redis and a celery
        run: bash interop/setup.sh

      - name: eight scenarios, each checked against what it claims
        run: bash interop/check.sh

      - name: both directions on one queue
        run: |
          bash interop/run_interop.sh | tee "$RUNNER_TEMP/interop-out.txt"
          grep -q '"status": "SUCCESS"' "$RUNNER_TEMP/interop-out.txt"

  # The SQL store against a real PostgreSQL. The statements are checked in the
  # module's unit tests; what only a server can say is whether the upsert clause,
  # the placeholders and the types are the ones it accepts, and whether a flow
  # running on a worker really leaves a row behind.
  sql:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MOONTASK_SQL_LIVE: "1"
      MOONTASK_SQL_HOST: 127.0.0.1
      MOONTASK_SQL_PORT: "5432"
      MOONTASK_SQL_USER: postgres
      MOONTASK_SQL_PASSWORD: postgres
      MOONTASK_SQL_DATABASE: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check (the module on every target, the live module here)
        run: |
          moon check --target all --deny-warn moontask-sql/src/sql
          moon check --target native --deny-warn integration/sql-live/src/live

      - name: the store and the run records against a real server
        run: |
          moon test --target native -p moonbitstack/moontask-sql/sql
          moon test --target native -p moonbitstack/moontask-sql-live/live
