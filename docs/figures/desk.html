<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The desk — a figure of moontask</title>
<style>
  /* One palette, two settings. Every face and stroke takes its colour from here,
     so the drawing turns with the page instead of sitting on it as a light
     rectangle. */
  :root {
    --paper: #f2efe7;
    --ink: #241f18;
    --ink-soft: #6d6354;
    --wood-t: #d3a06a; --wood-x: #b9824c; --wood-y: #96652f;
    --case-t: #e9dcc0; --case-x: #d3c19f; --case-y: #b8a37e;
    --brass-t: #e8c66a; --brass-x: #cba63e; --brass-y: #a8832a;
    --card: #fdfaf0; --card-x: #e6ddc8;
    --seal: #a33824;
    --steel: #d3d8d6; --steel-x: #aab1af;
    --red: #b23c2b;
    --rule: #cabfa4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14120d; --ink: #f0e6d0; --ink-soft: #a2957c;
      --wood-t: #7c5731; --wood-x: #654325; --wood-y: #4c3119;
      --case-t: #d8c9a8; --case-x: #bda985; --case-y: #9c8763;
      --brass-t: #b8923c; --brass-x: #97722c; --brass-y: #74561f;
      --card: #efe4c8; --card-x: #d3c5a4;
      --seal: #c2533c; --steel: #cdd3d1; --steel-x: #a7aeac;
      --red: #cf5a44; --rule: #4a4234;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14120d; --ink: #f0e6d0; --ink-soft: #a2957c;
    --wood-t: #7c5731; --wood-x: #654325; --wood-y: #4c3119;
    --case-t: #d8c9a8; --case-x: #bda985; --case-y: #9c8763;
    --brass-t: #b8923c; --brass-x: #97722c; --brass-y: #74561f;
    --card: #efe4c8; --card-x: #d3c5a4;
    --seal: #c2533c; --steel: #cdd3d1; --steel-x: #a7aeac;
    --red: #cf5a44; --rule: #4a4234;
    color-scheme: dark;
  }

  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body {
    display: flex; flex-direction: column; box-sizing: border-box;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 6px 10px 8px;
    transition: background 0.28s ease;
  }
  #stage { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .face { stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; }
  .thin { stroke: var(--ink-soft); stroke-width: 0.5; fill: none; opacity: 0.55; }
  .inkline { stroke: var(--ink); fill: none; stroke-linecap: round; }

  .wood-t { fill: var(--wood-t); } .wood-x { fill: var(--wood-x); } .wood-y { fill: var(--wood-y); }
  .case-t { fill: var(--case-t); } .case-x { fill: var(--case-x); } .case-y { fill: var(--case-y); }
  .brass-t { fill: var(--brass-t); } .brass-x { fill: var(--brass-x); } .brass-y { fill: var(--brass-y); }
  .steel, .steel-t { fill: var(--steel); } .steel-x { fill: var(--steel-x); }
  .paper, .paper-t { fill: var(--card); } .paper-x { fill: var(--card-x); }
  .seal { fill: var(--seal); stroke: var(--ink); stroke-width: 0.55; }
  .red, .red-t { fill: var(--red); }
  .tagname { fill: var(--ink-soft); font: 700 2.4px ui-monospace, Menlo, monospace; letter-spacing: 0.06em; }

  .label {
    fill: var(--ink-soft); font: 700 3.1px ui-monospace, Menlo, monospace;
    letter-spacing: 0.15em; text-anchor: middle; transition: fill 0.3s ease;
  }
  .label.live { fill: var(--ink); }

  #hud {
    display: flex; gap: 14px; align-items: baseline; justify-content: center;
    font: 700 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.13em;
    color: var(--ink-soft); text-transform: uppercase; padding: 0 0 5px;
  }
  #hud b { color: var(--ink); }

  #note {
    margin: 0 auto; max-width: 60ch; min-height: 2.5em; text-align: center;
    color: var(--ink-soft); font-size: 12.5px; line-height: 1.32;
    transition: color 0.25s ease;
  }
  #note.act { color: var(--ink); }

  #controls { display: flex; gap: 8px; justify-content: center; margin-top: 7px; flex-wrap: wrap; }
  button {
    font: 600 11.5px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.03em;
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--brass-y);
    background: linear-gradient(180deg, var(--brass-t), var(--brass-x));
    color: #241f18; cursor: pointer; box-shadow: 0 2px 0 var(--brass-y);
    transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.2s ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--brass-y); }
  button.ghost { background: none; color: var(--ink-soft); border-color: var(--rule); box-shadow: none; }
  button.ghost:hover { color: var(--ink); }
  @media (max-width: 560px) {
    button { padding: 7px 9px; font-size: 11px; }
    #note { font-size: 12px; }
  }
</style>
</head>
<body>
<script>try{var t=localStorage.getItem("moontask-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<div id="stage">
  <svg id="scene" viewBox="-90 -56 232 178" role="img"
       aria-label="An isometric desk: a wooden in-tray of task cards, a punch clock with a press, and a line of tags."></svg>
</div>
<div id="hud"><span>queued <b id="hq">0</b></span><span>sealed <b id="hs">0</b></span><span id="hstate">idle</span></div>
<p id="note">A card is a message, the clock is a worker, the line is what finished.</p>
<div id="controls">
  <button id="send">Send a card</button>
  <button id="run">Run the worker</button>
  <button id="take" class="ghost">Take a tag off</button>
</div>
<script>
/* The desk, drawn as flat isometric faces.
 *
 * x runs toward the lower right, y toward the lower left, z up, so a point lands
 * at ((x - y)·cos30, (x + y)·0.5 - z). Every solid is three quads — its top, its
 * +x face and its +y face — emitted in the one order this camera sees them. No
 * depth sort at run time, and nothing can be drawn through anything else: the
 * order is the file's order.
 */
const COS = Math.cos(Math.PI / 6), SIN = 0.5;
const P = (x, y, z) => [(x - y) * COS, (x + y) * SIN - z];
const fmt = (p) => p.map((n) => n.toFixed(2)).join(",");
const pts = (list) => list.map((p) => fmt(P(p[0], p[1], p[2]))).join(" ");
const quad = (list, cls) => `<polygon class="face ${cls}" points="${pts(list)}"/>`;

/** One solid: top, the face toward the lower right, the face toward the lower left. */
function box(x0, y0, z0, x1, y1, z1, cls) {
  return quad([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], cls + "-t")
    + quad([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], cls + "-x")
    + quad([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], cls + "-y");
}
/** A disc standing on a face whose normal is +x. */
function disc(x, cy, cz, r, cls, n = 24) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    out.push([x, cy + r * Math.cos(a), cz + r * Math.sin(a)]);
  }
  return `<polygon class="face ${cls}" points="${pts(out)}"/>`;
}
const line = (a, b, w, extra = "") =>
  `<line class="inkline" style="stroke-width:${w}"${extra} x1="${P(...a)[0]}" y1="${P(...a)[1]}" x2="${P(...b)[0]}" y2="${P(...b)[1]}"/>`;

/* ---------- the furniture ---------- */
const BOARD = { x1: 118, y1: 84, h: 4 };
const TRAY = { x0: 4, x1: 38, y0: 44, y1: 78, top: 14, lip: 6.5 };
const CLOCK = { x0: 52, x1: 82, y0: 42, y1: 70, top: 42 };
const SHELF = { x0: 82, x1: 94, y0: 40, y1: 60, z: 8, h: 2.4 };
const LINE = { x: 108, y0: 8, y1: 52, z: 27 };
const PINS = [15, 28, 41];
const CARD_W = 13, CARD_H = 10;

let art = "";
art += box(0, 0, 0, BOARD.x1, BOARD.y1, BOARD.h, "wood");

/* the tray: floor, back wall, two sides, the cards, the low front lip */
art += box(TRAY.x0, TRAY.y0, BOARD.h, TRAY.x1, TRAY.y1, BOARD.h + 1.4, "wood");
art += box(TRAY.x0, TRAY.y0, BOARD.h + 1.4, TRAY.x0 + 1.6, TRAY.y1, TRAY.top, "wood");
art += box(TRAY.x0, TRAY.y0, BOARD.h + 1.4, TRAY.x1, TRAY.y0 + 1.6, TRAY.top, "wood");
art += box(TRAY.x0, TRAY.y1 - 1.6, BOARD.h + 1.4, TRAY.x1, TRAY.y1, TRAY.top, "wood");
art += `<g id="cards"></g>`;
art += box(TRAY.x1 - 1.8, TRAY.y0 + 1.6, BOARD.h + 1.4, TRAY.x1, TRAY.y1 - 1.6, TRAY.lip, "wood");

/* the punch clock */
art += box(CLOCK.x0 - 2, CLOCK.y0 - 2, BOARD.h, CLOCK.x1, CLOCK.y1 + 2, BOARD.h + 4, "case");
art += box(CLOCK.x0, CLOCK.y0, BOARD.h, CLOCK.x1, CLOCK.y1, CLOCK.top, "case");
art += box(CLOCK.x0 + 2, CLOCK.y0 + 3, CLOCK.top, CLOCK.x1 - 3, CLOCK.y1 - 2, CLOCK.top + 3, "case");

const DIAL = { y: 57, z: 28, r: 6.6 };
art += disc(CLOCK.x1 + 0.5, DIAL.y, DIAL.z, DIAL.r + 1.1, "brass");
art += `<polygon class="face" style="fill:#fdfbf3" points="${pts(Array.from({length:24},(_,i)=>{const a=i/24*Math.PI*2;return [CLOCK.x1+0.9, DIAL.y+DIAL.r*Math.cos(a), DIAL.z+DIAL.r*Math.sin(a)];}))}"/>`;
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2, r0 = DIAL.r - 1.2, r1 = DIAL.r - 0.35;
  art += line([CLOCK.x1 + 1, DIAL.y + r0 * Math.cos(a), DIAL.z + r0 * Math.sin(a)],
              [CLOCK.x1 + 1, DIAL.y + r1 * Math.cos(a), DIAL.z + r1 * Math.sin(a)], 0.55);
}
const ctr = P(CLOCK.x1 + 1.1, DIAL.y, DIAL.z);
art += `<g id="hands">
  <line class="inkline" style="stroke-width:1.5" x1="${ctr[0]}" y1="${ctr[1]}" x2="${ctr[0] + 4.6}" y2="${ctr[1] - 2.6}"/>
  <line class="inkline" style="stroke-width:1.9" x1="${ctr[0]}" y1="${ctr[1]}" x2="${ctr[0] - 2.4}" y2="${ctr[1] + 3.4}"/>
  <circle cx="${ctr[0]}" cy="${ctr[1]}" r="0.9" fill="var(--ink)"/></g>`;

/* the press: a shelf, two brackets, a ram with a red die, a lever, the link */
art += box(SHELF.x0, SHELF.y0, SHELF.z, SHELF.x1, SHELF.y1, SHELF.z + SHELF.h, "brass");
for (const y of [43, 55]) art += box(SHELF.x0, y, BOARD.h, SHELF.x0 + 5, y + 3, SHELF.z, "brass");
const RAM = { x0: 85, x1: 92, y0: 45, y1: 57, z: 15.5, h: 5.2 };
art += `<g id="ram">` + box(RAM.x0, RAM.y0, RAM.z, RAM.x1, RAM.y1, RAM.z + RAM.h, "steel")
  + box(RAM.x0 + 0.8, RAM.y0 + 1, RAM.z - 1.2, RAM.x1 - 0.8, RAM.y1 - 1, RAM.z, "red") + `</g>`;
const LEVER = { x: 89, y: 62, z: 18, len: 10.5 };
const lvTop = P(LEVER.x, LEVER.y, LEVER.z + LEVER.len);
art += `<g id="lever">`
  + line([LEVER.x, LEVER.y, LEVER.z], [LEVER.x, LEVER.y, LEVER.z + LEVER.len], 2.6)
  + line([LEVER.x, LEVER.y, LEVER.z + LEVER.len], [RAM.x0 + 3, RAM.y1 - 2, RAM.z + RAM.h + 1], 1)
  + `<circle cx="${lvTop[0]}" cy="${lvTop[1]}" r="1.9" fill="var(--brass-t)" stroke="var(--ink)" stroke-width=".9"/></g>`;

/* the line: the far post, the string, the pins, the tags, the chord bar, the near post */
art += box(LINE.x - 1, LINE.y0 - 1, BOARD.h, LINE.x + 1, LINE.y0 + 1, LINE.z, "brass");
const sag = [];
for (let k = 0; k <= 4; k++) {
  const t = k / 4;
  sag.push(P(LINE.x, LINE.y0 + (LINE.y1 - LINE.y0) * t, LINE.z - 2.4 * Math.sin(t * Math.PI)));
}
art += `<path class="inkline" style="stroke-width:1.8" d="M${sag.map((p) => p[0] + " " + p[1]).join("L")}"/>`;
for (const y of PINS) art += box(LINE.x - 0.7, y - 0.7, LINE.z - 1.3, LINE.x + 0.7, y + 0.7, LINE.z + 1.1, "brass");
art += `<g id="tags"></g>`;
art += box(LINE.x - 1, LINE.y1 - 1, BOARD.h, LINE.x + 1, LINE.y1 + 1, LINE.z, "brass");

/* words in the room the drawing leaves */
const tag = (x, y, z, text, dx, dy, id) =>
  `<text class="label" id="${id}" x="${P(x, y, z)[0] + dx}" y="${P(x, y, z)[1] + dy}">${text}</text>`;
art += tag(20, 62, TRAY.top + 20, "QUEUE", 0, 0, "lb-q");
art += tag(62, 52, CLOCK.top + 21, "WORKER", 0, 0, "lb-w");
art += tag(LINE.x, 26, LINE.z + 16, "LINE", 0, 0, "lb-l");

const svg = document.getElementById("scene");
svg.innerHTML = art;
/* frame the drawing from its own bounds: nothing cropped, no margin guessed */
{
  const bb = svg.getBBox();
  const pad = 7;
  svg.setAttribute("viewBox", [bb.x - pad, bb.y - pad, bb.width + pad * 2, bb.height + pad * 2].map((n) => n.toFixed(1)).join(" "));
}
const fly = document.createElementNS("http://www.w3.org/2000/svg", "g");
fly.setAttribute("id", "fly");
svg.append(fly);
const cardsLayer = document.getElementById("cards");
const tagsLayer = document.getElementById("tags");

/* ---------- cards ---------- */
const NS = "http://www.w3.org/2000/svg";
const mk = (name, attrs) => {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const poses = {
  tray: (i) => {
    const x = 33 - i * 4.6, y = 68 - i * 2.2, z = BOARD.h + 2.2;
    return [
      P(x, y, z), P(x, y + CARD_W, z),
      P(x - 2.4, y + CARD_W, z + CARD_H), P(x - 2.4, y, z + CARD_H),
    ];
  },
  flat: () => [
    P(SHELF.x0 + 3, SHELF.y0 + 7, SHELF.z + SHELF.h + 0.2),
    P(SHELF.x0 + 3, SHELF.y0 + 7 + CARD_W, SHELF.z + SHELF.h + 0.2),
    P(SHELF.x1 - 2, SHELF.y0 + 7 + CARD_W, SHELF.z + SHELF.h + 0.2),
    P(SHELF.x1 - 2, SHELF.y0 + 7, SHELF.z + SHELF.h + 0.2),
  ],
  hang: (i) => [
    P(LINE.x, PINS[i] - CARD_W / 2, LINE.z - 1.6),
    P(LINE.x, PINS[i] + CARD_W / 2, LINE.z - 1.6),
    P(LINE.x, PINS[i] + CARD_W / 2, LINE.z - 1.6 - CARD_H),
    P(LINE.x, PINS[i] - CARD_W / 2, LINE.z - 1.6 - CARD_H),
  ],
};
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
/** Run `fn` after `ms`, on a frame, so the whole figure keeps one clock. */
const after = (ms, fn) => {
  const t0 = performance.now();
  const step = (now) => (now - t0 >= ms ? fn() : requestAnimationFrame(step));
  requestAnimationFrame(step);
};

function makeCard(flaky) {
  const g = mk("g", {});
  const face = mk("polygon", { class: "face paper" });
  const r1 = mk("line", { class: "thin" });
  const r2 = mk("line", { class: "thin" });
  const seal = mk("circle", { class: "seal", r: "1.7", opacity: "0" });
  g.append(face, r1, r2, seal);
  const card = { g, face, r1, r2, seal, flaky, retried: false, sealed: false, pose: null };
  card.draw = (p, sealed) => {
    face.setAttribute("points", p.map(fmt).join(" "));
    for (const [node, t] of [[r1, 0.42], [r2, 0.64]]) {
      const a = mix(mix(p[0], p[1], 0.16), mix(p[3], p[2], 0.16), t);
      const b = mix(mix(p[0], p[1], 0.84), mix(p[3], p[2], 0.84), t);
      node.setAttribute("x1", a[0].toFixed(2)); node.setAttribute("y1", a[1].toFixed(2));
      node.setAttribute("x2", b[0].toFixed(2)); node.setAttribute("y2", b[1].toFixed(2));
    }
    const c = p.reduce((acc, q) => [acc[0] + q[0] / 4, acc[1] + q[1] / 4], [0, 0]);
    seal.setAttribute("cx", c[0].toFixed(2));
    seal.setAttribute("cy", c[1].toFixed(2));
    seal.setAttribute("opacity", sealed ? "1" : "0");
  };
  return card;
}

function tween(card, to, ms, done) {
  const from = card.pose || to;
  fly.append(card.g);
  const start = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - start) / ms);
    const e = t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2;
    card.draw(from.map((q, i) => mix(q, to[i], e)), card.sealed && t > 0.8);
    if (t < 1) requestAnimationFrame(step);
    else { card.pose = to; if (done) done(); }
  };
  card.pose = from;
  requestAnimationFrame(step);
}

/* ---------- state ---------- */
const state = { queue: [], press: null, line: [], busy: false };
const note = document.getElementById("note");
const hq = document.getElementById("hq"), hs = document.getElementById("hs"), hstate = document.getElementById("hstate");
const say = (text, act = true) => {
  note.textContent = text;
  note.classList.toggle("act", act);
};
const sync = () => {
  hq.textContent = state.queue.length;
  hs.textContent = state.line.length;
  hstate.textContent = state.busy ? "running" : state.press ? "claimed" : "idle";
  document.getElementById("lb-q").classList.toggle("live", state.queue.length > 0);
  document.getElementById("lb-w").classList.toggle("live", !!state.press);
  document.getElementById("lb-l").classList.toggle("live", state.line.length > 0);
};

function place(i) {
  const card = state.queue[i];
  const p = poses.tray(i);
  card.pose = p;
  card.draw(p, false);
  if (card.g.parentNode !== cardsLayer) cardsLayer.append(card.g);
}
function layoutTray() { state.queue.forEach((_, i) => place(i)); }
function layoutLine() {
  state.line.forEach((card, i) => {
    const p = poses.hang(i);
    card.pose = p;
    card.draw(p, true);
    card.sealed = true;
    if (card.g.parentNode !== tagsLayer) tagsLayer.append(card.g);
  });
}

function placeChord() {}

/* ---------- the three moves ---------- */
function send() {
  if (state.busy) return;
  if (state.queue.length >= 3) return say("The tray is full: three messages are already waiting.", false);
  const card = makeCard(false);
  state.queue.push(card);
  place(state.queue.length - 1);
  sync();
  say("Published. One message on the queue, waiting for a worker to claim it.");
}

function run() {
  if (state.busy) return;
  if (state.press) return press();
  if (!state.queue.length) return say("The queue is empty. Send a card first.", false);

  const card = state.queue.shift();
  state.press = card;
  state.busy = true;
  layoutTray();
  sync();
  say("Claimed. The worker takes the message off the queue; nobody else can see it now.");
  tween(card, poses.flat(), 540, () => {
    state.busy = false;
    sync();
    press();
  });
}

function press() {
  const card = state.press;
  if (!card || state.busy) return;
  state.busy = true;
  sync();
  const ram = document.getElementById("ram");
  const lever = document.getElementById("lever");
  const origin = P(LEVER.x, LEVER.y, LEVER.z);
  lever.style.transformOrigin = `${origin[0]}px ${origin[1]}px`;
  ram.style.transition = lever.style.transition = "transform .18s ease-in";
  ram.style.transform = "translateY(7px)";
  lever.style.transform = "rotate(-15deg)";
  say("Running. The lever drives the ram down; the die stamps the card.");
  after(260, () => {
    ram.style.transition = lever.style.transition = "transform .24s ease-out";
    ram.style.transform = "translateY(0)";
    lever.style.transform = "rotate(0deg)";
    const hands = document.getElementById("hands");
    hands.style.transition = "transform .5s ease-out";
    hands.style.transformOrigin = `${ctr[0]}px ${ctr[1]}px`;
    hands.style.transform = "rotate(28deg)";
    setTimeout(() => { hands.style.transform = ""; }, 520);
    settle();
  });
}

function settle() {
  const card = state.press;
  state.press = null;
  if (card.flaky && !card.retried) {
    card.retried = true;
    state.busy = true;
    sync();
    const back = poses.tray(0);
    tween(card, back, 480, () => {
      state.queue.unshift(card);
      state.busy = false;
      layoutTray();
      sync();
      say("It failed. Back on the queue with an eta from the backoff — attempt 2. Nothing is lost.");
    });
    return;
  }
  if (state.line.length >= 3) {
    state.press = card;
    state.busy = false;
    sync();
    return say("The line is full: take a tag off before hanging another.", false);
  }
  state.busy = true;
  sync();
  state.line.push(card);
  tween(card, poses.hang(state.line.length - 1), 500, () => {
    card.sealed = true;
    layoutLine();
    state.busy = false;
    sync();
    say(state.line.length === 3
      ? "Sealed and hung. The third part completes the group: the bar levels and the callback is sent."
      : "Settled. The result is stored under the run's id, and the tag hangs on the line.");
  });
}

function take() {
  if (state.busy) return;
  if (!state.line.length) return say("Nothing is hanging yet.", false);
  const card = state.line.shift();
  card.g.remove();
  layoutLine();
  placeChord();
  sync();
  say("Taken off the line. The result is still in the store; only the tag is gone.");
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("run").addEventListener("click", run);
document.getElementById("take").addEventListener("click", take);
addEventListener("keydown", (e) => {
  if (e.key === "1") send();
  if (e.key === "2") run();
  if (e.key === "3") take();
});

/* A tray that starts loaded, one of whose cards is the one that fails, so the
   retry happens without waiting for luck. */
for (let i = 0; i < 3; i++) {
  const card = makeCard(i === 0);
  state.queue.push(card);
}
layoutTray();
placeChord();
sync();

/* Follow the page. The site stores the reader's choice under one key and this
   document reads the same key, so the drawing turns with the site rather than
   sitting on it as a light rectangle. */
function theme() {
  const chosen = (() => { try { return localStorage.getItem("moontask-theme"); } catch (e) { return null; } })();
  const dark = chosen === "dark" || (chosen !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (chosen) document.documentElement.setAttribute("data-theme", chosen);
  else document.documentElement.removeAttribute("data-theme");
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
}
theme();
addEventListener("storage", (e) => { if (e.key === "moontask-theme") theme(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
</script>
